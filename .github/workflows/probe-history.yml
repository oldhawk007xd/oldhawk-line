name: Probe history sources
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Which sources reach back to 2021 and Jan 2025
        run: node scripts/probe-history.mjs
        env:
          COINGECKO_DEMO_KEY: ${{ secrets.COINGECKO_DEMO_KEY }}
